<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Edit Web page </title>
    <style>
        header {
            display: flex;
            justify-content: center;
            padding-left: 45px;
            padding-right: 45px;



        }

        p {
            margin: 0;
            padding: 0;
            background-color: #f2d205;
            padding: 16px;
            text-align: center;

        }

        ul {
            display: flex;
            padding: 12px;
            border: solid rgb(138, 133, 122)
        }

        li {
            text-decoration: none;
            list-style-type: none;
            padding: 15px;
            align-content: center;
            justify-content: center;

        }

        body {
            margin: 0;
        }


        button {
            height: 35px;
            width: 255px;
            margin-left: 500px;
            background-color: rgb(231, 211, 32);
            align-content: center;
            justify-content: center;
            margin-top: 10px;
            margin-right: 20px;
        }

        div {
            align-items: center;
            margin-left: 200px;
            font-size: 0.6cm;
            margin-top: 100px;

        }

        h1 {
            background-color: rgb(246, 251, 249);
        }

        .grid-container {
            display: grid;
            grid-template-columns: auto;
            grid-template-rows: auto;
            gap: 10px;
            margin-right: 60px;
        }

        .grid-item {
            background-color: #5abe29;
            padding: 20px;
            text-align: center;
        }
        main{
            background-color: aquamarine;
            margin: 40px;
            height: 200vh;
        }
    </style>

</head>

<body>
    <P>UE Core & Enterprise Subscriptions: Get 10% Off on your second year__

    <header>
        <nav>
            <ul>
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo-1.png" alt="Logo"
                    width="150px height=10px">

                <li>Product </li>
                <li>Buy </li>
                <li>Renew </li>
                <li>Support </li>
                <li>Learn </li>
                <li>Company </li>
                <button>Download</button>

            </ul>
        </nav>

    </header>
    <div>
        <h1>Download UltraEdit for Windows
            Small Microsoft Icon
            <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/image-1-1-1.svg" alt="Window" width="45px"
                height="35px">
        </h1>
    </div>
    <main>
        <div class="grid-container">
            <div class="grid-item">Column 1</div>
            <div class="grid-item">Column 2</div>
            <div class="grid-item">Column 3</div>
            <div class="grid-item">Column 3</div>
            <div class="grid-item">Column 3</div>
            <div class="grid-item">Column 3</div>
            <div class="grid-item">Column 3</div>
            <div class="grid-item">Column 3</div>

    </footer>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css positioning </title>
    <style>
        body{
            padding:0;
            margin: 0;
            height: 200vh;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        .container{
            position: relative;
            height: 400px;
            border: 2px solid black;
            padding: 40px;
            margin: 20px;
            

        }
        .box{
            width: 100px;
            height: 50px;
            margin: 10px;
            padding: 10px;
            background-color: beige;
            text-align: center;
            line-height: 50px;
        }
        .static{
            position: static;
            background-color: rgb(1, 222, 38);
             top: 20px;
             left: 20px;
        }
        .relative{
            position: relative;
            background-color: rgb(9, 58, 81);
            top: 30px;
            
           
        }
        .fixed{
            position: fixed;
            background-color: rgb(222, 98, 98);
            top: 80px;
            left: 6opx;
        }
        .absolute{
            position: absolute;
            background-color: rgb(173, 107, 224);
            top: 40px;
            right: 40px;
        }
        .sticky{
            position: sticky;
            background-color: rgb(226, 243, 102);
            top: 20px;
            left: 20px;
           
        }

        
    </style>

</head>
<body>
    <div class="container">
        <div class="box static">STATIC</div>
        <div class="box raltive">RELATIVE</div>
        <div class="box fixed">FIXED</div>
        <div class="box absolute">ABSOLUTE</div>
        <div class="box sticky">STICKY</div>

    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styleg.css">
</head>

<body>
    <h2>Rock Paper Scissors</h2>
    <div class="picture">

       <div class="emoji" id="paper"><img src="photo/Paper.jpg" alt="paper"></div> 

       <div class="emoji" id="rock"><img src="photo/Rock.jpg" alt="rock"></div> 

       <div class="emoji" id="scissors"><img src="photo/Scissors.jpg" alt="scissors"></div> 

    </div>

    <div class="score">
       <div class="sc">
        <p id="userscore">0</p>
        <p>User-Score</p>
       </div>
       <div class="sc">
        <p id="compscore">0</p>
        <p>AI-Score</p>
       </div>    
    </div>
    <div class="btm">
       <p id="mesg">Play Your Move</p>
    </div>
    <script src="app.js"></script>
</body>

</html>

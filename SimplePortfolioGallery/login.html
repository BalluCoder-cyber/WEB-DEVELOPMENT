<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Login page</title>
    <style>
        body{
            height: 100%;
            font-family: Arial,sans-serif;
            margin: 0;
        }
        .bg-img{
            background-image: url("https://media.geeksforgeeks.org/wp-content/cdn-uploads/CSS.png");
            min-height: 100vh;
            background-size: cover;
            display: flex;
            flex-direction:column;
            align-items: center;
            justify-content: center;
        }
        .container{
            position:relative;
            max-width: 300px;
            padding:16px;
            background:rgba(255,255,255,0.8);
            border-radius: 9px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1{
            text-align: center;
            color: rgb(231, 18, 67);
            -webkit-text-stroke:1px rgb(79, 74, 74);
            margin-bottom: 20px;
        }
        b{
            color: rgb(9, 26, 212);
            fornt-size:18px ;
            -webkit-text-stroke: 1px rgb(60, 83, 150);
        }
        input[type="text"],input[type="password"]{
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid black;
            box-sizing: border-box;

        }
        .button{
            background-color: rgb(229, 73, 169) ;
            color: rgb(200, 197, 222);
            padding: 14px;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .button:hover{
            background-color: rgb(58, 60, 58);
        }
    </style>
</head>
<body>
    <div class="bg-img">
    <h1>Ballu_Coder </h1>
    <form class="container">
       <b>Username</b>
       <input type="text" placeholder="Enter your name" name="username" required> 
       <b>Password</b>
       <input type="password" placeholder="Enter your password" name="password" required>
       <button type="submit" class="button">Login</button>
    </form>
    </div>
    
</body>
</html>
